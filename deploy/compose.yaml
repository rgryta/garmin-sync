services:
  garmin-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - autoheal=true
    image: ghcr.io/rgryta/garmin-sync:0.1.1
    container_name: garmin-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GARMIN_MCP_DSN: postgresql://garmin_mcp:${GARMIN_MCP_DB_PASSWORD}@homelab-postgres:5432/garmin
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: "8000"
      GARMIN_MCP_ALLOWED_HOSTS: garmin-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/garmin-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.95
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/garmin-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  garmin-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: ghcr.io/rgryta/garmin-sync:0.1.1
    container_name: garmin-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GARMIN_DSN: postgresql://garmin_ingest:${GARMIN_INGEST_DB_PASSWORD}@homelab-postgres:5432/garmin
      GARMIN_ACCOUNT: ${GARMIN_ACCOUNT}
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/garmin-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.96
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

networks:
  homelab-network:
    external: true
