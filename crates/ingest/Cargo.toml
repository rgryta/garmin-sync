# The ingester: the Garmin private API's answers to archive rows, and the
# `garmin-ingest` process that polls and backfills with them.
[package]
name = "garmin-ingest"
description = "The Garmin ingester: poll, backfill, and payloads to archive rows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

[[bin]]
name = "garmin-ingest"
path = "src/bin/garmin-ingest.rs"

[dependencies]
chrono.workspace = true
garmin-client = { path = "../garmin" }
fitparser = "0.12.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
garmin-core.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "test-util"] }
