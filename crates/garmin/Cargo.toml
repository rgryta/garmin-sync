# The Garmin private-API client: reads Garmin Connect's connectapi endpoints over HTTPS
# with a Bearer token it refreshes itself, and refreshes a Bearer token itself. No database: it
# fetches and parses, nothing more.
#
# MIT: this client talks to a documented-by-observation private API and holds no code
# derived from an AGPL source.
[package]
name = "garmin-client"
description = "Read-only client for Garmin Connect private API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "json", "http2"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
